name: Build and Push

on:
  push:
    branches:
      - ghes-support
      - main
    paths:
      - 'plugins/**'
      - 'server/**'
      - 'shared/**'
      - 'app/**'
      - 'Dockerfile.combined'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build-push-ghes.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp
        id: timestamp
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/cameron-mckain/outline
          tags: |
            type=raw,value=main-{{sha}}-${{ steps.timestamp.outputs.ts }},enable={{is_default_branch}}
            type=raw,value=ghes-support-{{sha}}-${{ steps.timestamp.outputs.ts }},enable=${{ github.ref == 'refs/heads/ghes-support' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.combined
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
